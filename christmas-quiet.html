<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07130e">
  <meta name="description" content="一棵由光组成的圣诞树。移动、点击、许愿，让这个冬天的夜晚亮起来。">
  <title>圣诞树 · 愿你被温柔的光包围 | Interactive Lab</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='32' fill='%2307130e'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23e8c77f'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --night: #07130e;
      --cream: #f7efdc;
      --cream-soft: rgba(247, 239, 220, .68);
      --gold: #e7c47e;
      --gold-bright: #ffe4a6;
      --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, "Songti SC", "STSong", "SimSun", serif;
      --sans: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
      --mono: "Cascadia Mono", "Consolas", "SFMono-Regular", monospace;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--night);
      color: var(--cream);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    #scene {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 62% 47%, transparent 26%, rgba(2, 8, 5, .40) 68%, rgba(2, 8, 5, .82) 100%);
    }

    .scene-header {
      position: fixed;
      z-index: 3;
      top: 0;
      right: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: clamp(20px, 3.6vw, 38px) clamp(22px, 4.4vw, 54px);
      color: rgba(247, 239, 220, .48);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .18em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .scene-header i { color: var(--gold); font-style: normal; opacity: .7; }

    .scene-header a {
      color: inherit;
      text-decoration: none;
      pointer-events: auto;
      transition: color .25s;
    }

    .scene-header a:hover { color: var(--cream); }

    .intro {
      position: fixed;
      z-index: 4;
      top: 50%;
      left: clamp(22px, 5.4vw, 76px);
      width: min(460px, 38vw);
      transform: translateY(-50%);
      pointer-events: none;
    }

    .eyebrow {
      margin: 0 0 20px;
      color: rgba(231, 196, 126, .82);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .22em;
      line-height: 1.8;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(34px, 3.7vw, 54px);
      font-weight: 500;
      letter-spacing: -.045em;
      line-height: 1.08;
      text-shadow: 0 3px 34px rgba(3, 10, 6, .55);
    }

    h1 .gold { color: var(--gold-bright); }

    .hint {
      max-width: 34ch;
      margin: 24px 0 0;
      color: var(--cream-soft);
      font-size: 11.5px;
      line-height: 1.85;
      letter-spacing: .01em;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 27px;
      pointer-events: auto;
    }

    .actions button {
      min-height: 42px;
      padding: 0 18px;
      border: 1px solid rgba(231, 196, 126, .40);
      border-radius: 999px;
      background: rgba(231, 196, 126, .07);
      color: var(--cream);
      font-family: var(--sans);
      font-size: 11px;
      letter-spacing: .05em;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background .25s, border-color .25s, transform .25s, color .25s;
    }

    .actions button:hover {
      transform: translateY(-2px);
      border-color: rgba(231, 196, 126, .82);
      background: rgba(231, 196, 126, .15);
    }

    .actions button.primary {
      border-color: var(--gold);
      background: var(--gold);
      color: #162015;
    }

    .actions button.primary:hover { background: #f1d69a; }

    .actions button:focus-visible,
    .scene-header a:focus-visible {
      outline: 2px solid var(--gold-bright);
      outline-offset: 4px;
    }

    .wish-message {
      position: fixed;
      z-index: 4;
      bottom: 17vh;
      left: clamp(22px, 5.4vw, 76px);
      max-width: 360px;
      margin: 0;
      color: var(--gold-bright);
      font-family: var(--serif);
      font-size: clamp(17px, 1.8vw, 22px);
      letter-spacing: .02em;
      line-height: 1.6;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .9s ease, transform .9s cubic-bezier(.2, .7, .2, 1);
      pointer-events: none;
    }

    .wish-message span {
      display: block;
      margin-top: 7px;
      color: rgba(247, 239, 220, .34);
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .wish-message.is-visible {
      opacity: 1;
      transform: none;
    }

    .scene-foot {
      position: fixed;
      z-index: 3;
      right: clamp(22px, 4.4vw, 54px);
      bottom: clamp(20px, 3.6vw, 38px);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
      color: rgba(247, 239, 220, .28);
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: .17em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      clip-path: inset(50%);
    }

    @media (max-width: 820px) {
      .vignette {
        background:
          radial-gradient(ellipse at 50% 62%, transparent 30%, rgba(2, 8, 5, .42) 78%, rgba(2, 8, 5, .78) 100%);
      }

      .intro {
        top: clamp(76px, 11vh, 120px);
        right: 6vw;
        left: 6vw;
        width: auto;
        transform: none;
      }

      .eyebrow {
        margin-bottom: 14px;
        font-size: 8px;
      }

      h1 {
        font-size: clamp(34px, 9.6vw, 48px);
        letter-spacing: -.04em;
      }

      .hint { display: none; }

      .actions { margin-top: 19px; gap: 8px; }
      .actions button { min-height: 39px; padding: 0 15px; font-size: 10px; }

      .wish-message {
        right: 6vw;
        bottom: 15vh;
        left: 6vw;
        max-width: none;
        text-align: center;
      }

      .scene-foot {
        right: 50%;
        bottom: 18px;
        transform: translateX(50%);
        align-items: center;
        font-size: 7.5px;
      }

      .scene-foot span:first-child { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <header class="scene-header">
    <span>Interactive Lab <i>/</i> No. 02</span>
    <a href="index.html">← 返回实验室</a>
  </header>

  <main class="intro">
    <p class="eyebrow" id="sceneEyebrow">A Quiet Christmas · 2026</p>
    <h1><span id="line1">愿你被</span><br><span class="gold" id="line2">温柔的光包围。</span></h1>
    <p class="hint" id="sceneHint">移动鼠标，让灯光呼吸。点击任意处，点亮一颗星，也许再许一个愿。</p>
    <div class="actions">
      <button class="primary" id="wishButton" type="button">许个愿 ✦</button>
      <button id="soundButton" type="button" aria-pressed="true"><span id="soundLabel">声音 开</span></button>
    </div>
    <p class="sr-only" id="sceneHelp">这是一个可交互的圣诞树场景。点击画面会点亮星光并播放铃声，点击“许个愿”会触发一次光的波动。</p>
  </main>

  <p class="wish-message" id="wishMessage" role="status" aria-live="polite">
    愿你所愿，皆有回响。
    <span>Wish sent to the light</span>
  </p>

  <div class="scene-foot" aria-hidden="true">
    <span>Move · Click · Wish</span>
    <span>No. 02 / 2026</span>
  </div>

  <noscript>
    <p style="position:fixed;inset:auto 24px 24px;z-index:9;color:#f7efdc;font-family:sans-serif;font-size:13px;">
      这个场景需要 JavaScript 才能点亮。
    </p>
  </noscript>

  <script src="lab-archive.js"></script>
  <script>
    "use strict";

    (function () {
      const canvas = document.getElementById("scene");
      const ctx = canvas.getContext("2d");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const DEFAULT_CONFIG = {
        titleLine1: "愿你被",
        titleLine2: "温柔的光包围。",
        eyebrow: "A Quiet Christmas · 2026",
        hint: "移动鼠标，让灯光呼吸。点击任意处，点亮一颗星，也许再许一个愿。",
        sound: true,
        density: 1
      };

      const config = Object.assign({}, DEFAULT_CONFIG);
      const WORK_ID = "christmas";
      const NOTES = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];

      const line1 = document.getElementById("line1");
      const line2 = document.getElementById("line2");
      const sceneEyebrow = document.getElementById("sceneEyebrow");
      const sceneHint = document.getElementById("sceneHint");
      const soundButton = document.getElementById("soundButton");
      const soundLabel = document.getElementById("soundLabel");
      const wishButton = document.getElementById("wishButton");
      const wishMessage = document.getElementById("wishMessage");

      let width = 0;
      let height = 0;
      let dpr = 1;
      let time = 0;
      let lastFrame = 0;
      let wishStart = -999;
      let wishTimer = 0;
      let soundOn = true;
      let density = 1;
      let audioCtx = null;
      let lastBell = 0;
      let session = null;
      let resizeTimer = 0;

      const tree = { cx: 0, topY: 0, baseY: 0, maxR: 0 };
      const pointer = { x: 0, y: 0, tx: 0, ty: 0 };
      let lights = [];
      let ornaments = [];
      let snow = [];
      let sparks = [];
      let wishParticles = [];
      let ripples = [];
      const sprites = {};
      const gradients = {};

      /* ---------- 小工具 ---------- */

      function random(min, max) {
        return min + Math.random() * (max - min);
      }

      function makeGlowSprite(core, mid) {
        const sprite = document.createElement("canvas");
        sprite.width = 64;
        sprite.height = 64;
        const spriteCtx = sprite.getContext("2d");
        const gradient = spriteCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
        gradient.addColorStop(0, "rgba(255,255,255,1)");
        gradient.addColorStop(.18, core);
        gradient.addColorStop(.5, mid);
        gradient.addColorStop(1, "rgba(0,0,0,0)");
        spriteCtx.fillStyle = gradient;
        spriteCtx.fillRect(0, 0, 64, 64);
        return sprite;
      }

      function log(type, detail, extra) {
        if (session) {
          session.log(type, detail, extra);
        } else if (window.InteractiveLab) {
          window.InteractiveLab.logEvent(WORK_ID, type, detail, extra);
        }
      }

      /* ---------- 场景构建 ---------- */

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        buildGeometry();
        buildLights();
        buildSnow();
        buildGradients();

        pointer.x = pointer.tx = width / 2;
        pointer.y = pointer.ty = height / 2;
      }

      function buildGeometry() {
        const mobile = width < 820;

        tree.cx = width * (mobile ? .50 : (width > 1160 ? .64 : .62));
        tree.baseY = height * (mobile ? .90 : .915);
        tree.topY = height * (mobile ? .44 : .15);

        const heightSpan = tree.baseY - tree.topY;
        tree.maxR = Math.min(
          heightSpan * .40,
          width * (mobile ? .40 : .255)
        );
      }

      function buildLights() {
        lights = [];
        ornaments = [];

        const baseCount = Math.round(Math.min(460, Math.max(190, width * height / 3600)));
        const count = Math.max(90, Math.round(baseCount * density * (reduceMotion ? .62 : 1)));

        for (let i = 0; i < count; i++) {
          const t = Math.sqrt(Math.random());
          const angle = Math.random() * Math.PI * 2;
          const radius = tree.maxR * t * random(.92, 1.02);

          lights.push({
            x: tree.cx + Math.cos(angle) * radius + random(-7, 7),
            y: tree.topY + t * (tree.baseY - tree.topY) + random(-6, 6),
            depth: (Math.sin(angle) + 1) / 2,
            t: t,
            size: random(.9, 2.4),
            phase: random(0, Math.PI * 2),
            speed: random(.5, 1.9),
            color: Math.random() < .2 ? "cream" : "gold",
            alpha: random(.42, .9)
          });
        }

        const garlandCount = Math.round(150 * density);
        for (let i = 0; i < garlandCount; i++) {
          const t = i / garlandCount;
          const angle = t * Math.PI * 7.1 + .6;
          const radius = tree.maxR * t * .985;

          lights.push({
            x: tree.cx + Math.cos(angle) * radius,
            y: tree.topY + t * (tree.baseY - tree.topY),
            depth: (Math.sin(angle) + 1) / 2,
            t: t,
            size: random(1.6, 2.7),
            phase: random(0, Math.PI * 2),
            speed: random(.7, 1.5),
            color: "gold",
            alpha: random(.7, 1),
            garland: true
          });
        }

        lights.sort(function (a, b) { return a.depth - b.depth; });

        const ornamentCount = Math.round(18 * Math.min(density, 1.4));
        for (let i = 0; i < ornamentCount; i++) {
          const t = random(.16, .95);
          const angle = random(0, Math.PI * 2);
          const radius = tree.maxR * t * random(.75, .98);

          ornaments.push({
            x: tree.cx + Math.cos(angle) * radius,
            y: tree.topY + t * (tree.baseY - tree.topY),
            t: t,
            depth: (Math.sin(angle) + 1) / 2,
            r: random(3.4, 6.8),
            phase: random(0, Math.PI * 2)
          });
        }

        ornaments.sort(function (a, b) { return a.depth - b.depth; });
      }

      function buildSnow() {
        snow = [];
        const count = Math.round((reduceMotion ? 46 : 105) * Math.min(1.35, width / 1100 + .45));

        for (let i = 0; i < count; i++) {
          snow.push({
            x: Math.random() * width,
            y: Math.random() * height,
            r: random(.6, 1.9),
            speed: random(7, 26),
            drift: random(-3, 3),
            phase: random(0, Math.PI * 2),
            alpha: random(.16, .58)
          });
        }
      }

      function buildGradients() {
        const heightSpan = tree.baseY - tree.topY;
        const glowY = tree.baseY - heightSpan * .42;

        gradients.sky = ctx.createLinearGradient(0, 0, 0, height);
        gradients.sky.addColorStop(0, "#050f0a");
        gradients.sky.addColorStop(.55, "#0c1e15");
        gradients.sky.addColorStop(1, "#040c08");

        gradients.warm = ctx.createRadialGradient(
          tree.cx, glowY, 0,
          tree.cx, glowY, tree.maxR * 3.1
        );
        gradients.warm.addColorStop(0, "rgba(215, 170, 88, .17)");
        gradients.warm.addColorStop(.45, "rgba(190, 145, 70, .07)");
        gradients.warm.addColorStop(1, "rgba(190, 145, 70, 0)");

        gradients.ground = ctx.createRadialGradient(
          tree.cx, tree.baseY, 0,
          tree.cx, tree.baseY, tree.maxR * 2.2
        );
        gradients.ground.addColorStop(0, "rgba(225, 183, 100, .13)");
        gradients.ground.addColorStop(1, "rgba(225, 183, 100, 0)");

        gradients.body = ctx.createLinearGradient(tree.cx, tree.topY, tree.cx, tree.baseY);
        gradients.body.addColorStop(0, "rgba(34, 74, 52, .12)");
        gradients.body.addColorStop(.52, "rgba(22, 55, 38, .46)");
        gradients.body.addColorStop(1, "rgba(8, 27, 17, .80)");
      }

      /* ---------- 绘制 ---------- */

      function drawBackground() {
        ctx.fillStyle = gradients.sky;
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = gradients.warm;
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = gradients.ground;
        ctx.fillRect(0, tree.baseY - tree.maxR, width, tree.maxR * 2.2);
      }

      function drawSnow() {
        ctx.save();
        for (let i = 0; i < snow.length; i++) {
          const flake = snow[i];
          ctx.globalAlpha = flake.alpha;
          ctx.fillStyle = "rgba(235, 246, 240, 1)";
          ctx.beginPath();
          ctx.arc(flake.x, flake.y, flake.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawTreeBody() {
        ctx.beginPath();
        ctx.moveTo(tree.cx, tree.topY);
        ctx.lineTo(tree.cx - tree.maxR * 1.02, tree.baseY);
        ctx.lineTo(tree.cx + tree.maxR * 1.02, tree.baseY);
        ctx.closePath();
        ctx.fillStyle = gradients.body;
        ctx.fill();

        ctx.strokeStyle = "rgba(231, 196, 126, .08)";
        ctx.lineWidth = 1;
        ctx.stroke();

        // 底部的一圈暖光，让树像是落在夜色里。
        ctx.beginPath();
        ctx.ellipse(tree.cx, tree.baseY + 4, tree.maxR * 1.08, 16, 0, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(226, 180, 94, .06)";
        ctx.fill();
      }

      function drawLights() {
        const age = time - wishStart;
        ctx.save();
        ctx.globalCompositeOperation = "lighter";

        for (let i = 0; i < lights.length; i++) {
          const light = lights[i];
          const sway = Math.sin(time * .75 + light.phase) * 1.6
            + (pointer.x - width / 2) * .012 * (.4 + light.depth);
          const bob = Math.sin(time * .62 + light.phase * 1.3) * .9;

          let twinkle = .60 + .40 * Math.sin(time * light.speed + light.phase);
          if (reduceMotion) twinkle = .82;

          let wave = 0;
          if (age >= 0 && age < 4.2) {
            const distance = age - .08 - light.t * 1.15;
            wave = Math.exp(-(distance * distance) / .022);
          }

          const x = light.x + sway;
          const y = light.y + bob;
          const alpha = Math.min(1, light.alpha * twinkle + wave * .55);
          const size = (light.size * (1 + light.depth * .55) + wave * 3.2) * 7.5;
          const sprite = light.color === "cream" ? sprites.cream : sprites.gold;

          ctx.globalAlpha = alpha * (.6 + light.depth * .4);
          ctx.drawImage(sprite, x - size / 2, y - size / 2, size, size);
        }

        ctx.restore();
      }

      function drawOrnaments() {
        ctx.save();
        for (let i = 0; i < ornaments.length; i++) {
          const ornament = ornaments[i];
          const sway = (pointer.x - width / 2) * .008 * (.45 + ornament.depth);
          const pulse = .80 + .20 * Math.sin(time * 1.15 + ornament.phase);
          const x = ornament.x + sway;
          const y = ornament.y + Math.sin(time * .8 + ornament.phase) * 1.2;
          const halo = ornament.r * 7.5 * pulse;

          ctx.globalCompositeOperation = "lighter";
          ctx.globalAlpha = .55 * pulse;
          ctx.drawImage(sprites.gold, x - halo / 2, y - halo / 2, halo, halo);

          ctx.globalCompositeOperation = "source-over";
          ctx.globalAlpha = 1;
          ctx.beginPath();
          ctx.arc(x, y, ornament.r * (.9 + ornament.depth * .18), 0, Math.PI * 2);
          ctx.fillStyle = "rgba(255, 224, 158, .96)";
          ctx.fill();

          ctx.beginPath();
          ctx.arc(x - ornament.r * .30, y - ornament.r * .34, ornament.r * .30, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(255, 255, 245, .92)";
          ctx.fill();
        }
        ctx.restore();
      }

      function drawStar() {
        const x = tree.cx;
        const y = tree.topY - 11;
        const pulse = .84 + .16 * Math.sin(time * 1.35);
        const halo = 104 * pulse;

        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = .72 * pulse;
        ctx.drawImage(sprites.gold, x - halo / 2, y - halo / 2, halo, halo);
        ctx.restore();

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(Math.sin(time * .32) * .05);
        ctx.beginPath();
        ctx.moveTo(0, -32);
        ctx.lineTo(5.5, -6);
        ctx.lineTo(31, 0);
        ctx.lineTo(5.5, 6);
        ctx.lineTo(0, 31);
        ctx.lineTo(-5.5, 6);
        ctx.lineTo(-31, 0);
        ctx.lineTo(-5.5, -6);
        ctx.closePath();
        ctx.fillStyle = "rgba(255, 232, 174, .96)";
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, 0, 4.2, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255, 255, 250, .98)";
        ctx.fill();
        ctx.restore();
      }

      function drawSparks(dt) {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";

        sparks = sparks.filter(function (spark) {
          spark.x += spark.vx * dt;
          spark.y += spark.vy * dt;
          spark.vy += 28 * dt;
          spark.vx *= Math.pow(.96, dt * 60);
          spark.life -= spark.decay * dt;
          return spark.life > 0;
        });

        for (let i = 0; i < sparks.length; i++) {
          const spark = sparks[i];
          const size = spark.size * 8.5 * spark.life;
          ctx.globalAlpha = Math.min(1, spark.life);
          ctx.drawImage(
            spark.color === "cream" ? sprites.cream : sprites.gold,
            spark.x - size / 2,
            spark.y - size / 2,
            size,
            size
          );
        }

        ripples = ripples.filter(function (ripple) {
          ripple.r += 62 * dt;
          ripple.alpha -= .9 * dt;
          return ripple.alpha > 0;
        });

        for (let i = 0; i < ripples.length; i++) {
          const ripple = ripples[i];
          ctx.globalAlpha = Math.max(0, ripple.alpha);
          ctx.strokeStyle = "rgba(238, 201, 126, .8)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(ripple.x, ripple.y, ripple.r, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.restore();
      }

      function drawWishParticles(dt) {
        if (!wishParticles.length) return;

        ctx.save();
        ctx.globalCompositeOperation = "lighter";

        wishParticles = wishParticles.filter(function (particle) {
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          particle.vx += Math.sin(time * 1.4 + particle.phase) * 3.2 * dt;
          particle.life -= particle.decay * dt;
          return particle.life > 0;
        });

        for (let i = 0; i < wishParticles.length; i++) {
          const particle = wishParticles[i];
          const fade = Math.min(1, particle.life);
          const size = particle.size * 10 * fade;
          ctx.globalAlpha = fade * .9;
          ctx.drawImage(
            sprites.gold,
            particle.x - size / 2,
            particle.y - size / 2,
            size,
            size
          );
        }

        ctx.restore();
      }

      function updateSnow(dt) {
        const speedScale = reduceMotion ? .35 : 1;
        for (let i = 0; i < snow.length; i++) {
          const flake = snow[i];
          flake.y += flake.speed * speedScale * dt;
          flake.x += Math.sin(time * .35 + flake.phase) * .22 + flake.drift * dt;

          if (flake.y > height + 8) {
            flake.y = -8;
            flake.x = Math.random() * width;
          }
          if (flake.x < -8) flake.x = width + 8;
          if (flake.x > width + 8) flake.x = -8;
        }
      }

      /* ---------- 声音 ---------- */

      function ensureAudio() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return null;
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function playBell(frequency, volume) {
        if (!soundOn) return;
        const audio = ensureAudio();
        if (!audio) return;

        const now = audio.currentTime;
        const master = audio.createGain();
        master.gain.setValueAtTime(.0001, now);
        master.gain.exponentialRampToValueAtTime(volume || .055, now + .012);
        master.gain.exponentialRampToValueAtTime(.0001, now + 2.4);
        master.connect(audio.destination);

        const partials = [
          { ratio: 1, gain: 1 },
          { ratio: 2.01, gain: .28 },
          { ratio: 2.98, gain: .12 }
        ];

        partials.forEach(function (partial) {
          const oscillator = audio.createOscillator();
          const partialGain = audio.createGain();
          oscillator.type = "sine";
          oscillator.frequency.value = frequency * partial.ratio;
          partialGain.gain.value = partial.gain;
          oscillator.connect(partialGain);
          partialGain.connect(master);
          oscillator.start(now);
          oscillator.stop(now + 2.5);
        });
      }

      function playRandomBell() {
        const now = performance.now();
        if (now - lastBell < 95) return;
        lastBell = now;
        playBell(NOTES[Math.floor(Math.random() * NOTES.length)], .05);
      }

      function playWishChord() {
        if (!soundOn) return;
        playBell(523.25, .04);
        setTimeout(function () { playBell(659.25, .035); }, 130);
        setTimeout(function () { playBell(783.99, .03); }, 260);
      }

      function updateSoundButton() {
        soundButton.setAttribute("aria-pressed", String(soundOn));
        soundLabel.textContent = soundOn ? "声音 开" : "声音 关";
      }

      /* ---------- 交互 ---------- */

      function burst(x, y, amount) {
        const count = reduceMotion ? 14 : (amount || 32);
        for (let i = 0; i < count; i++) {
          const angle = random(0, Math.PI * 2);
          const speed = random(22, 155);
          sparks.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 18,
            life: 1,
            decay: random(.55, 1.15),
            size: random(1, 2.6),
            color: Math.random() < .25 ? "cream" : "gold"
          });
        }
        ripples.push({ x: x, y: y, r: 5, alpha: .55 });
        if (sparks.length > 420) sparks.splice(0, sparks.length - 420);
      }

      function triggerWish() {
        wishStart = time;
        wishMessage.classList.add("is-visible");
        clearTimeout(wishTimer);
        wishTimer = setTimeout(function () {
          wishMessage.classList.remove("is-visible");
        }, 4800);

        const count = reduceMotion ? 26 : 78;
        for (let i = 0; i < count; i++) {
          wishParticles.push({
            x: tree.cx + random(-1, 1) * tree.maxR * 1.7,
            y: tree.baseY - random(0, 36),
            vx: random(-8, 8),
            vy: -random(26, 96),
            life: 1,
            decay: random(.14, .30),
            size: random(.7, 2.4),
            phase: random(0, Math.PI * 2)
          });
        }

        playWishChord();
        log("wish", "许下一个愿望");
      }

      function handlePointerMove(event) {
        pointer.tx = event.clientX;
        pointer.ty = event.clientY;
      }

      function handlePointerDown(event) {
        burst(event.clientX, event.clientY, 34);
        playRandomBell();
        log("gesture", "点亮一颗星", { x: Math.round(event.clientX), y: Math.round(event.clientY) });
      }

      function handleSoundToggle() {
        soundOn = !soundOn;
        updateSoundButton();
        if (soundOn) playBell(783.99, .04);
        log("setting", soundOn ? "打开声音" : "关闭声音");
      }

      /* ---------- 配置 ---------- */

      function trimText(value, fallback) {
        return typeof value === "string" && value.trim() ? value.trim().slice(0, 120) : fallback;
      }

      function applyConfig(saved) {
        if (saved && typeof saved === "object" && !Array.isArray(saved)) {
          config.titleLine1 = trimText(saved.titleLine1, DEFAULT_CONFIG.titleLine1);
          config.titleLine2 = trimText(saved.titleLine2, DEFAULT_CONFIG.titleLine2);
          config.eyebrow = trimText(saved.eyebrow, DEFAULT_CONFIG.eyebrow);
          config.hint = trimText(saved.hint, DEFAULT_CONFIG.hint);
          config.sound = saved.sound !== false;
          if (typeof saved.density === "number" && isFinite(saved.density)) {
            config.density = Math.min(1.6, Math.max(.45, saved.density));
          }
        }

        line1.textContent = config.titleLine1;
        line2.textContent = config.titleLine2;
        sceneEyebrow.textContent = config.eyebrow;
        sceneHint.textContent = config.hint;
        soundOn = config.sound;
        updateSoundButton();

        if (config.density !== density) {
          density = config.density;
          buildLights();
        }
      }

      async function loadConfig() {
        if (!window.InteractiveLab) return;
        try {
          const saved = await window.InteractiveLab.getWorkConfig(WORK_ID);
          if (saved) {
            applyConfig(saved);
            log("config", "已读取档案馆配置");
          }
        } catch (error) {
          console.info("[Christmas] 使用默认配置：", error && error.message);
        }
      }

      /* ---------- 主循环 ---------- */

      function animate(now) {
        const dt = lastFrame ? Math.min((now - lastFrame) / 1000, .05) : 0;
        lastFrame = now;
        time += dt;

        const easing = 1 - Math.exp(-dt * 4);
        pointer.x += (pointer.tx - pointer.x) * easing;
        pointer.y += (pointer.ty - pointer.y) * easing;

        updateSnow(dt);
        drawBackground();
        drawSnow();
        drawTreeBody();
        drawLights();
        drawOrnaments();
        drawStar();
        drawSparks(dt);
        drawWishParticles(dt);

        requestAnimationFrame(animate);
      }

      /* ---------- 启动 ---------- */

      sprites.gold = makeGlowSprite("rgba(255, 233, 180, .95)", "rgba(231, 196, 126, .34)");
      sprites.cream = makeGlowSprite("rgba(255, 250, 235, .95)", "rgba(255, 241, 205, .28)");

      resize();

      if (window.InteractiveLab) {
        session = window.InteractiveLab.beginSession(WORK_ID);
      }

      loadConfig();

      canvas.addEventListener("pointerdown", handlePointerDown);
      window.addEventListener("pointermove", handlePointerMove, { passive: true });
      window.addEventListener("pointerleave", function () {
        pointer.tx = width / 2;
        pointer.ty = height / 2;
      });
      soundButton.addEventListener("click", handleSoundToggle);
      wishButton.addEventListener("click", triggerWish);

      window.addEventListener("resize", function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(resize, 160);
      });

      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
